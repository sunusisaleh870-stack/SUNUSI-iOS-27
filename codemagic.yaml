
workflows:
  sunusi-ios-27:
    name: SUNUSI iOS 27 APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    scripts:
      - name: Extract project ZIP
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/appsrc"
          unzip -o "$CM_BUILD_DIR/SUNUSI_iOS_27_Source_Project.zip" -d "$CM_BUILD_DIR/appsrc"

      - name: Download Gradle
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          curl -fL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
          unzip -q -o gradle.zip

      - name: Build Android APK
        script: |
          set -e
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/appsrc/local.properties"
          "$CM_BUILD_DIR/gradle-8.7/bin/gradle" -p "$CM_BUILD_DIR/appsrc" assembleDebug

    artifacts:
      - appsrc/app/build/outputs/apk/debug/*.apk
